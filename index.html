<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Route Atlas</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K78VEPW3N3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-K78VEPW3N3');
    </script>

    <!-- Dependencies -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>

<body>
    <div id="globeViz"></div>
    <div id="ui-layer">
        <button id="ui-toggle-btn" aria-label="Toggle UI">◀</button>
        <h1>Airport Route Atlas</h1>
        <p>Click an airport to view outbound routes.</p>
        <div id="controls">
            <div id="search-wrapper">
                <input type="text" id="search-input" placeholder="Search IATA or Name...">
                <div id="search-suggestions"></div>
            </div>
            <div id="route-search-wrapper">
                <input type="text" id="route-search-input" placeholder="Search Route (e.g. LHR-JFK)...">
                <div id="route-search-suggestions"></div>
            </div>
            <select id="category-filter">
                <option value="">All Categories</option>
            </select>
            <button id="reset-btn">Reset View</button>
        </div>

        <div id="loading">Loading flight data...</div>
    </div>

    <div id="route-info-panel" style="display: none;">
        <div id="route-header">
            <div class="route-airport" id="route-src">
                <div class="route-iata">SRC</div>
                <div class="route-desc">City, Country</div>
            </div>
            <div class="route-separator">-</div>
            <div class="route-airport" id="route-dst">
                <div class="route-iata">DST</div>
                <div class="route-desc">City, Country</div>
            </div>
        </div>
        <div class="route-stat">
            <span class="label">Daily Flights</span>
            <span class="value" id="route-flights">-</span>
        </div>
        <div class="route-stat">
            <span class="label">Distance</span>
            <span class="value" id="route-stage">-</span>
        </div>
        <div class="route-stat">
            <span class="label">Duration</span>
            <span class="value" id="route-duration">-</span>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
