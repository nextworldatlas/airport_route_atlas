<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Route Atlas</title>
    <link rel="stylesheet" href="style.css">

    <!-- Dependencies -->
    <script src="https://unpkg.com/globe.gl"></script>
    <!-- We will use ES modules for the main logic, but globe.gl is loaded as a global script for simplicity with some versions, 
         or we can import it if we use the module version. The example used a script tag. 
         Let's stick to the script tag for globe.gl to match the example, but use modules for our logic. -->
</head>

<body>
    <div id="globeViz"></div>
    <div id="ui-layer">
        <h1>Airport Route Atlas</h1>
        <p>Click an airport to view outbound routes.</p>
        <div id="loading">Loading flight data...</div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
