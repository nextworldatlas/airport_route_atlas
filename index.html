<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Route Atlas - 3D Satellite</title>
    <!-- Load specific version to ensure stability -->
    <script src="https://unpkg.com/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="globeViz"></div>

    <div class="overlay">
        <h1>Global Flight Network</h1>
        <p>Real-time visualization of international air travel routes.</p>

        <div class="controls-section">
            <div class="control-group">
                <label for="rotateToggle">Auto-Rotation</label>
                <input type="checkbox" id="rotateToggle" checked>
            </div>

            <div class="control-group">
                <label for="categorySelect">Airport Size</label>
                <select id="categorySelect">
                    <option value="All">All Sizes</option>
                    <option value="Large">Large</option>
                    <option value="Medium">Medium</option>
                    <option value="Small">Small</option>
                </select>
            </div>
        </div>

        <div class="instructions">
            • Drag to rotate<br>
            • Scroll to zoom<br>
            • Click airport to focus
        </div>
    </div>

    <script src="main.js"></script>
</body>

</html>
