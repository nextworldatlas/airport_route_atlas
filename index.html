<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airport Route Atlas</title>
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K78VEPW3N3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-K78VEPW3N3');
    </script>

    <!-- Dependencies -->
    <script src="https://unpkg.com/globe.gl"></script>
</head>

<body>
    <div id="globeViz"></div>
    <div id="ui-layer">
        <h1>Airport Route Atlas</h1>
        <div id="controls">
            <div id="search-wrapper">
                <input type="text" id="search-input" placeholder="Search IATA or Name...">
                <div id="search-suggestions"></div>
            </div>
            <select id="category-filter">
                <option value="">All Categories</option>
            </select>
            <button id="reset-btn">Reset View</button>
        </div>
        <p>Click an airport to view outbound routes.</p>
        <div id="loading">Loading flight data...</div>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
